<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200" role="img" aria-labelledby="einn-title einn-desc">
  <title id="einn-title">EINN</title>
  <desc id="einn-desc">EINN — Einstein-notation neural networks. A tensor-contraction diagram reduces three tokens to one.</desc>

  <defs>
    <linearGradient id="einn-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="einn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="818" height="198" rx="28" fill="url(#einn-bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- tensor-contraction mark: 3 tokens -> 2 -> 1 -->
  <g stroke="url(#einn-mark)" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <path d="M94 62 L148 84"/>
    <path d="M94 62 L148 116"/>
    <path d="M94 100 L148 84"/>
    <path d="M94 100 L148 116"/>
    <path d="M94 138 L148 84"/>
    <path d="M94 138 L148 116"/>
    <path d="M158 84 L196 100"/>
    <path d="M158 116 L196 100"/>
  </g>

  <g>
    <circle cx="92" cy="62" r="9" fill="#38bdf8"/>
    <circle cx="92" cy="100" r="9" fill="#60a5fa"/>
    <circle cx="92" cy="138" r="9" fill="#818cf8"/>
    <circle cx="150" cy="84" r="7.5" fill="#a78bfa"/>
    <circle cx="150" cy="116" r="7.5" fill="#a78bfa"/>
    <circle cx="200" cy="100" r="12" fill="url(#einn-mark)"/>
  </g>

  <!-- wordmark -->
  <text x="246" y="112" fill="#f8fafc" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="5">EINN</text>
  <text x="250" y="145" fill="#94a3b8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" letter-spacing="0.4">Einstein-notation neural networks</text>
  <text x="250" y="172" fill="#64748b" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.2">m?k × k?K → m?K</text>

  <!-- archive tag -->
  <g>
    <rect x="662" y="44" width="112" height="30" rx="15" fill="#1e293b"/>
    <text x="718" y="64" fill="#94a3b8" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="1.6">ARCHIVE · 2020</text>
  </g>
</svg>
